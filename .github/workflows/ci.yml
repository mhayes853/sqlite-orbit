name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linked system SQLite, which is what a caller gets by default.
          - name: default traits
            traits: ""
          # The default database and test trait also integrate with swift-dependencies. Naming
          # traits replaces the defaults, so Structured Queries is named to keep its tests.
          - name: SystemSQLite + Dependencies
            traits: "--traits SystemSQLite,Dependencies,StructuredQueries"
          # SQLCipher in place of the platform SQLite. The two are mutually exclusive, so this
          # also covers the package building with `SystemSQLite` off.
          - name: SQLCipher
            traits: "--traits SQLCipher,StructuredQueries"
          - name: SQLite Vec
            traits: "--traits default,Vectors"
          - name: SQLCipher + SQLite Vec
            traits: "--traits SQLCipher,StructuredQueries,Vectors"
          - name: SQLite Vec without Structured Queries
            traits: "--traits SystemSQLite,Vectors"
          # The UUIDV7 and Tagged conformances alongside Structured Queries, which binds the same
          # types through its own conformances.
          - name: UUIDV7 + Tagged
            traits: "--traits default,UUIDV7,Tagged"
          # No forbidden modules: swift-uuidv7 and swift-tagged import Foundation themselves.
          - name: UUIDV7 + Tagged without Structured Queries
            traits: "--disable-default-traits --traits SystemSQLite,UUIDV7,Tagged"
          # Raw SQL alone, without Structured Queries or Foundation. The raw SQL suite compiles
          # here and in the default job alike, which is what shows the traits only add API.
          - name: lean
            traits: "--disable-default-traits --traits SystemSQLite"
            forbidden-modules: "Foundation|FoundationEssentials|FoundationInternationalization"
          # Foundation conveniences without Structured Queries, which must stay within
          # FoundationEssentials rather than pulling in all of Foundation and ICU.
          - name: Foundation without Structured Queries
            traits: "--disable-default-traits --traits SystemSQLite,Foundation"
            forbidden-modules: "Foundation|FoundationInternationalization"
    steps:
      - uses: actions/checkout@v4

      # `CSQLite3` is a system library target resolved through pkg-config.
      - name: Install SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: Test
        run: swift test ${{ matrix.traits }}

      # The compiler's dependency files list every module the library's sources loaded, which is
      # what shows a trait kept its Foundation out.
      - name: Check loaded Foundation modules
        if: matrix.forbidden-modules
        run: |
          loaded=$(cat .build/debug/SQLiteOrbit.build/*.d | tr ' ' '\n' \
            | grep -oE '[A-Za-z_]+\.swiftmodule' | sed 's/\.swiftmodule$//' | sort -u)
          if echo "$loaded" | grep -xE '${{ matrix.forbidden-modules }}'; then
            echo "SQLiteOrbit loaded a Foundation module this configuration must not use." >&2
            exit 1
          fi

  test-turso:
    name: Linux (Turso)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Vectors builds the Vec C bridge against SQLite's extension headers, even when the
      # connections use Turso's native functions. SystemSQLite remains disabled below.
      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      # This downloads and links the release-hosted artifact. The rest of the test target includes
      # cases for SQLite capabilities Turso deliberately reports as unavailable. The migrator suite
      # keeps a test of functions registered through Structured Queries, so the trait is named too.
      - name: Test Turso compatibility
        run: |
          swift test --disable-default-traits --traits Turso,StructuredQueries \
            --filter '[Tt]urso'

      - name: Test migrations with Turso
        run: |
          swift test --disable-default-traits --traits Turso,StructuredQueries \
            --filter OrbitDatabaseMigratorTests

      - name: Test native vector helpers with TursoPool
        run: |
          swift test --disable-default-traits --traits Turso,StructuredQueries,Vectors \
            --filter 'TursoVectorTests|TursoVectorValueTests|EmbeddingVectorTests|TursoCompatibilityTests|OrbitDatabaseMigratorTests'

  test-swiftui:
    name: macOS (SwiftUI)
    # EmbeddingVector uses the OS 26 InlineArray/Span runtime.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # The fetch properties' SwiftUI half — the `DynamicProperty` conformances and the
      # `animation:` scheduler — compiles and runs nowhere else, so it is tested here.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Test SQLite Vec with Apple system SQLite
        run: swift test --traits default,Vectors --filter 'EmbeddingVectorTests|TursoVectorValueTests|SQLiteVecTests|SQLiteExtensionsTests'

      - name: Test SQLite Vec with SQLCipher
        run: swift test --traits SQLCipher,StructuredQueries,Vectors --filter 'EmbeddingVectorTests|TursoVectorValueTests|SQLiteVecTests|SQLiteExtensionsTests'

  test-reminders:
    name: iOS (Reminders demo)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test RemindersKit
        working-directory: Examples/Reminders/RemindersKit
        run: swift test

      - name: Test Reminders app
        run: |
          xcodebuild test \
            -project Examples/Reminders/Reminders.xcodeproj \
            -scheme Reminders \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=YES \
            -only-testing:RemindersTests

  build-without-sqlite:
    name: Linux (no traits)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Deliberately no SQLite installed: with every trait off the package links none, which is
      # what lets a caller supply their own build.
      - name: Build
        run: swift build --disable-default-traits

  build-android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift package for Android
        uses: swift-android-sdk/swift-android-action@v2
        with:
          swift-version: '6.4.0'
          swift-build-flags: --disable-default-traits
          build-tests: false
          run-tests: false

  build-wasi:
    name: WASI (threads)
    runs-on: ubuntu-latest
    container: swift:6.3.0
    steps:
      - uses: actions/checkout@v4

      # The official Wasm SDK has no threads target yet. This package requires threads.
      - name: Install threaded WASI SDK
        run: |
          swift sdk install https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-RELEASE/swift-wasm-6.3-RELEASE-wasm32-unknown-wasip1-threads.artifactbundle.zip \
            --checksum a09a0eed0fef420b4b8bb03e4dc0e7e2653ab6c88b44cb4f359ef06063b35c39
          swift sdk list

      - name: Build
        run: swift build --disable-default-traits --swift-sdk 6.3-RELEASE-wasm32-unknown-wasip1-threads

  build-wasi-single-threaded:
    name: WASI (single thread)
    runs-on: ubuntu-latest
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift SDK for WebAssembly
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

      - name: Build
        run: swift build --disable-default-traits --swift-sdk swift-6.4.0-RELEASE_wasm

  build-windows:
    name: Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Links no SQLite, so it shows the Windows branches of the core compile on their own.
          - name: no traits
            sqlite: false
            flags: "--disable-default-traits"
          # Windows has no system SQLite, so the `SystemSQLite` trait links vcpkg's. The library's
          # tests are compiled as well, though not yet run. The macro tests are left to the other
          # jobs: swift-macro-testing 0.7.0 has an ambiguous `String.init` on Windows, and a macro
          # expands on the host rather than the target anyway.
          - name: SystemSQLite
            sqlite: true
            flags: "--disable-default-traits --traits SystemSQLite --target SQLiteOrbitTests"
    steps:
      - uses: actions/checkout@v4

      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE

      - name: Install SQLite
        if: matrix.sqlite
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sqlite3:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "SQLITE_FLAGS=-Xcc -I$installed\include -Xlinker -L$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH

      - name: Build
        shell: pwsh
        run: |
          $flags = "${{ matrix.flags }} $env:SQLITE_FLAGS".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)
          swift build @flags
          exit $LASTEXITCODE

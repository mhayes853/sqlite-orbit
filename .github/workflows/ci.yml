name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: swift:6.3.3
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linked system SQLite, which is what a caller gets by default.
          - name: default traits
            traits: ""
          # SQLCipher in place of the platform SQLite. The two are mutually exclusive, so this
          # also covers the package building with `SystemSQLite` off.
          - name: SQLCipher
            traits: "--traits SQLCipher"
    steps:
      - uses: actions/checkout@v4

      # `CSQLite3` is a system library target resolved through pkg-config.
      - name: Install SQLite
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: Test
        run: swift test ${{ matrix.traits }}

  test-turso:
    name: Linux (Turso)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # This downloads and links the release-hosted artifact. The rest of the test target includes
      # cases for SQLite capabilities Turso deliberately reports as unavailable.
      - name: Test Turso compatibility
        run: swift test --disable-default-traits --traits Turso --filter TursoCompatibilityTests

      - name: Test migrations with Turso
        run: swift test --disable-default-traits --traits Turso --filter OrbitDatabaseMigratorTests

  test-swiftui:
    name: macOS (SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The fetch properties' SwiftUI half — the `DynamicProperty` conformances and the
      # `animation:` scheduler — compiles and runs nowhere else, so it is tested here.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

  build-without-sqlite:
    name: Linux (no traits)
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4

      # Deliberately no SQLite installed: with every trait off the package links none, which is
      # what lets a caller supply their own build.
      - name: Build
        run: swift build --disable-default-traits

  build-android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK r30
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip
          curl -fSL -o /tmp/android-ndk.zip https://dl.google.com/android/repository/android-ndk-r30-Linux.zip
          unzip -q /tmp/android-ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r30" >> "$GITHUB_ENV"

      - name: Install Swift SDK for Android
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43

      - name: Build
        run: swift build --disable-default-traits --swift-sdk swift-6.4.0-RELEASE_android --triple aarch64-unknown-linux-android23

  build-wasi:
    name: WASI (threads)
    runs-on: ubuntu-latest
    container: swift:6.3.0
    steps:
      - uses: actions/checkout@v4

      # The official Wasm SDK has no threads target yet. This package requires threads.
      - name: Install threaded WASI SDK
        run: |
          swift sdk install https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-RELEASE/swift-wasm-6.3-RELEASE-wasm32-unknown-wasip1-threads.artifactbundle.zip \
            --checksum a09a0eed0fef420b4b8bb03e4dc0e7e2653ab6c88b44cb4f359ef06063b35c39
          swift sdk list

      - name: Build
        run: swift build --disable-default-traits --swift-sdk 6.3-RELEASE-wasm32-unknown-wasip1-threads

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE

      - name: Build
        run: swift build --disable-default-traits
